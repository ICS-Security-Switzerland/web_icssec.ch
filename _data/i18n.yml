# UI strings and locale formatting rules.
#
# Single source for every piece of chrome text that used to be duplicated in
# {% case page.lang %} blocks across _includes/ and in the per-language pages.
#
# Adding a language means adding one block here — nothing else needs a new
# {% when %} branch.

en:
  name: English
  flag: 🇬🇧
  prefix: /
  nav:
    about: About
    events: Events
    members: Join
    contacts: Contact
  footer:
    nav: Navigation
    connect: Connect
    privacy: Privacy Policy
    privacy_path: /privacy/
    copyright: ICS Security Switzerland. All rights reserved.
    location: Bern, Switzerland
  events:
    label_end: ':'
    none_upcoming: No events scheduled right now — check back soon.
    topic: Topic
    speaker: Speaker
    location: Location
  date:
    # %w index: 0 = Sunday
    weekdays: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    months: [January, February, March, April, May, June, July, August, September, October, November, December]
    # {weekday} {day} {ordinal} {month} {year} are substituted by _includes/event-when.html
    with_weekday: "{weekday}, {day}{ordinal} {month} {year}"
    without_weekday: "{day}{ordinal} {month} {year}"
    ordinals: true
    time_format: "%-I:%M%P"
    # {start} and {end} are substituted with formatted times
    time_open_end: "from {start}"
    time_range: "{start}-{end}"
    time_range_approx: "{start} - approx. {end}"
    time_point: "{start}"

