# Single source of truth for every event on the site.
#
# Whether an event shows up under "Upcoming" or "Past" is decided at build time
# by comparing `date` with the build date — never by hand. The list is sorted by
# date automatically, so the order here does not matter (newest-first is just
# convenient for editing).
#
# Fields
#   date        required, YYYY-MM-DD. Drives sorting and the upcoming/past split.
#   start, end  optional "HH:MM" (24h). Rendered per language: 4:00pm / 16:00 / 16h00.
#   open_end    true for get-togethers with no fixed end -> "from 17:30" / "ab 17:30 Uhr".
#   end_approx  true -> "17:00 - approx. 18:00".
#   online      true for virtual meetups.
#   slides      optional URL to the deck. Rendered as a link on the card.
#   recording   optional URL to a recording. Same.
#   uid_suffix  optional. The UID of the downloadable calendar entry is built
#               from the date, so two events on the same date would collide;
#               give one of them a suffix.
#   title, topic, speaker, location, note, slides, recording
#               language-independent defaults; any of them can be overridden
#               inside an en/de/fr/it block. Markdown is allowed in the text
#               fields (not in slides/recording, which are plain URLs).
#
# Adding an event = one entry here. Nothing else needs touching. The events
# pages, the homepage teaser, the schema.org markup and the per-event calendar
# download all render from this file, so they cannot disagree with each other.

