# Board and auditors, shown as cards on the about pages.
#
# One entry per card. Names, LinkedIn links and initials are shared across
# languages; role and blurb are per-language. The auditors share one card —
# they hold the office jointly, and the blurb is about the pair.
- people:
    - name: Mathias Pfister
      initials: MP
      linkedin: https://www.linkedin.com/in/mathias-pfister/
  role:
    en: President
    de: Präsident
    fr: Président
    it: Presidente
  blurb:
    en: Brings people together and steers the club in the right direction.
    de: Bringt Menschen zusammen und lenkt den Verein in die richtige Richtung.
    fr: Rassemble les gens et guide l'association dans la bonne direction.
    it: Riunisce le persone e guida l'associazione nella giusta direzione.

