title: "ICS Security Switzerland"
description: "Connecting experts in Switzerland to advance industrial cybersecurity and IEC 62443 adoption."
url: "https://www.icssec.ch"
baseurl: ""
lang: en-GB
timezone: Europe/Zurich

# theme: minima  # using custom layouts

header_pages:
  - about.md
  - members.md
  - contacts.md

# jekyll-feed is deliberately absent. It generates an Atom feed of posts, and
# this site has no posts — it published /feed.xml with zero entries, advertised
# in the head of every page. Put jekyll-feed back the day there is a blog.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

permalink: /:categories/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo

date_format: "%-d. %B %Y"
show_excerpts: true

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
      locale: en_GB
  - scope:
      path: "de"
    values:
      locale: de_CH
  - scope:
      path: "fr"
    values:
      locale: fr_CH
  - scope:
      path: "it"
    values:
      locale: it_CH

# Dot-directories are skipped by default; this one carries security.txt.
include:
  - .well-known

exclude:
  - README.md
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - .github
  - scripts
