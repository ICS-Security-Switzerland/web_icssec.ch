<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-32.png' | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" sizes="180x180">
{% include hreflang.html %}

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
  {%- if page.schema == 'events' %}{% include events-jsonld.html %}{% endif %}
</head>
<body>
  {% include header.html %}

  <main id="content" class="main-content" aria-label="Content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
</body>
</html>
