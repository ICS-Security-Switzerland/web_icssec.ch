# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: pages-build-deploy-jekyll

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Validate site build on pull requests without deploying
  pull_request:
    branches: ["main"]

  # The upcoming/past split on the events page is evaluated against the build
  # date. Without a scheduled rebuild an event would stay under "Upcoming"
  # until somebody happens to push. 03:17 UTC daily, shortly after midnight
  # Europe/Zurich in both CET and CEST.
  schedule:
    - cron: "17 3 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read permission is enough for build checks.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
